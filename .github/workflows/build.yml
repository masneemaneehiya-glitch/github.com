name: Dinopack APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cp lib/main.dart /tmp/main.dart
      - run: flutter create --project-name dino_world .
      - run: cp /tmp/main.dart lib/main.dart
      - run: flutter pub add shared_preferences
      - run: flutter pub add --dev flutter_launcher_icons
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="[^"]*"/android:label="Dino World"/' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
